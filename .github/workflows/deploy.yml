name: Deploy CDK Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Docker image tag to deploy (leave empty for default)'
        required: false
        type: string
      stage:
        description: 'Deployment stage (prod or beta)'
        required: false
        type: choice
        options:
          - prod
          - beta
        default: prod
  repository_dispatch:
    types: [beta-deployed]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint dependencies
        run: npm install --save-dev eslint typescript typescript-eslint

      - name: Lint code
        run: npx eslint . || echo "Linting completed with warnings/errors"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Determine what to deploy based on trigger source
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.config.outputs.IMAGE_TAG }}
      stage: ${{ steps.config.outputs.STAGE }}
      deploy-beta: ${{ steps.config.outputs.DEPLOY_BETA }}
      deploy-prod: ${{ steps.config.outputs.DEPLOY_PROD }}
    steps:
      - name: Determine stage and image tag
        id: config
        run: |
          # Determine stage
          if [ "${{ github.event.action }}" == "beta-deployed" ]; then
            STAGE="beta"
          elif [ -n "${{ inputs.stage }}" ]; then
            STAGE="${{ inputs.stage }}"
          else
            STAGE="prod"
          fi

          # Determine image tag
          if [ -n "${{ github.event.client_payload.imageTag }}" ]; then
            IMAGE_TAG="${{ github.event.client_payload.imageTag }}"
          elif [ -n "${{ inputs.imageTag }}" ]; then
            IMAGE_TAG="${{ inputs.imageTag }}"
          elif [ "$STAGE" == "beta" ]; then
            IMAGE_TAG="beta"
          else
            IMAGE_TAG="prod"
          fi

          # Determine which stages to deploy
          # beta-deployed dispatch: deploy beta, then e2e, then prod (with approval)
          # workflow_dispatch or push: deploy only the requested stage
          if [ "${{ github.event.action }}" == "beta-deployed" ]; then
            DEPLOY_BETA="true"
            DEPLOY_PROD="true"
          elif [ "$STAGE" == "beta" ]; then
            DEPLOY_BETA="true"
            DEPLOY_PROD="false"
          else
            DEPLOY_BETA="false"
            DEPLOY_PROD="true"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "STAGE=${STAGE}" >> $GITHUB_OUTPUT
          echo "DEPLOY_BETA=${DEPLOY_BETA}" >> $GITHUB_OUTPUT
          echo "DEPLOY_PROD=${DEPLOY_PROD}" >> $GITHUB_OUTPUT

          echo "Stage: ${STAGE}, Image tag: ${IMAGE_TAG}, Deploy beta: ${DEPLOY_BETA}, Deploy prod: ${DEPLOY_PROD}"

  deploy-beta:
    runs-on: ubuntu-latest
    needs: [test, resolve-config]
    if: needs.resolve-config.outputs.deploy-beta == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598791268315:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: CDK diff (beta)
        run: |
          IMAGE_TAG="${{ needs.resolve-config.outputs.image-tag }}"
          echo "Running CDK diff for beta with image tag: ${IMAGE_TAG}"
          cdk diff --all --context imageTag="${IMAGE_TAG}" --context stage=beta || echo "No changes detected."

      - name: CDK deploy (beta)
        run: |
          IMAGE_TAG="${{ needs.resolve-config.outputs.image-tag }}"
          echo "Deploying beta with image tag: ${IMAGE_TAG}"
          cdk deploy --all --require-approval never --context imageTag="${IMAGE_TAG}" --context stage=beta

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [deploy-beta, resolve-config]
    if: needs.resolve-config.outputs.deploy-beta == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: thoughtful-coding/thoughtful-coding.github.io

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run authenticated E2E tests against beta
        run: npx playwright test --project=setup --project=authenticated
        env:
          VITE_API_GATEWAY_BASE_URL: ${{ secrets.BETA_API_GATEWAY_URL }}
          VITE_TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          VITE_TEST_USER_ID: instructor-test@thoughtful.local
          HOME: /root
          TZ: America/New_York
          LANG: en_US.UTF-8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: .playwright-report/
          retention-days: 30

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [test, resolve-config, e2e-tests]
    # Run if: (a) full pipeline after beta+e2e, or (b) direct prod deploy (manual/push)
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.resolve-config.outputs.deploy-prod == 'true' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598791268315:role/GitHubActionsCDKRole
          aws-region: us-west-1

      - name: CDK diff (prod)
        run: |
          IMAGE_TAG="${{ needs.resolve-config.outputs.image-tag }}"
          echo "Running CDK diff for prod with image tag: ${IMAGE_TAG}"
          cdk diff --all --context imageTag="${IMAGE_TAG}" --context stage=prod || echo "No changes detected."

      - name: CDK deploy (prod)
        run: |
          IMAGE_TAG="${{ needs.resolve-config.outputs.image-tag }}"
          echo "Deploying prod with image tag: ${IMAGE_TAG}"
          cdk deploy --all --require-approval never --context imageTag="${IMAGE_TAG}" --context stage=prod
