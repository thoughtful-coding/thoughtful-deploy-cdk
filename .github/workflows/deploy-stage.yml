name: Deploy Single Stage

# Escape hatch: manually deploy a single stage without going through the full pipeline.
# Useful for hotfixes, rollbacks, or re-deploying a specific image tag.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        type: choice
        options:
          - beta
          - prod
      imageTag:
        description: 'Docker image tag (leave empty for stage default: "beta" or "prod")'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'prod' && 'production' || '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Determine config
        id: config
        run: |
          STAGE="${{ inputs.stage }}"
          if [ -n "${{ inputs.imageTag }}" ]; then
            IMAGE_TAG="${{ inputs.imageTag }}"
          else
            IMAGE_TAG="${STAGE}"
          fi
          if [ "$STAGE" == "beta" ]; then
            AWS_REGION="us-east-1"
          else
            AWS_REGION="us-west-1"
          fi
          echo "STAGE=${STAGE}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "AWS_REGION=${AWS_REGION}" >> $GITHUB_OUTPUT
          echo "Deploying ${STAGE} with image tag: ${IMAGE_TAG} in ${AWS_REGION}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598791268315:role/GitHubActionsCDKRole
          aws-region: ${{ steps.config.outputs.AWS_REGION }}

      - name: CDK diff
        run: |
          cdk diff --all \
            --context imageTag="${{ steps.config.outputs.IMAGE_TAG }}" \
            --context stage="${{ steps.config.outputs.STAGE }}" \
            || echo "No changes detected."

      - name: CDK deploy
        run: |
          cdk deploy --all --require-approval never \
            --context imageTag="${{ steps.config.outputs.IMAGE_TAG }}" \
            --context stage="${{ steps.config.outputs.STAGE }}"
