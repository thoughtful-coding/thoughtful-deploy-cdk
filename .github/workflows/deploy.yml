name: Deploy Pipeline

# Full beta → e2e → prod pipeline.
# Triggered by: push to main, or backend repo after building a new Docker image.

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [beta-deployed]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint dependencies
        run: npm install --save-dev eslint typescript typescript-eslint

      - name: Lint code
        run: npx eslint . || echo "Linting completed with warnings/errors"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-beta:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598791268315:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Determine image tag
        id: image
        run: |
          if [ -n "${{ github.event.client_payload.imageTag }}" ]; then
            echo "TAG=${{ github.event.client_payload.imageTag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=beta" >> $GITHUB_OUTPUT
          fi

      - name: CDK diff (beta)
        run: |
          echo "Deploying beta with image tag: ${{ steps.image.outputs.TAG }}"
          cdk diff --all --context imageTag="${{ steps.image.outputs.TAG }}" --context stage=beta || echo "No changes detected."

      - name: CDK deploy (beta)
        run: cdk deploy --all --require-approval never --context imageTag="${{ steps.image.outputs.TAG }}" --context stage=beta

  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-beta
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: thoughtful-coding/thoughtful-coding.github.io

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run authenticated E2E tests against beta
        run: npx playwright test --project=setup --project=authenticated
        env:
          VITE_API_GATEWAY_BASE_URL: ${{ secrets.BETA_API_GATEWAY_URL }}
          VITE_TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          VITE_TEST_USER_ID: instructor-test@thoughtful.local
          HOME: /root
          TZ: America/New_York
          LANG: en_US.UTF-8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: .playwright-report/
          retention-days: 30

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598791268315:role/GitHubActionsCDKRole
          aws-region: us-west-1

      - name: Determine image tag
        id: image
        run: |
          if [ -n "${{ github.event.client_payload.imageTag }}" ]; then
            echo "TAG=${{ github.event.client_payload.imageTag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=prod" >> $GITHUB_OUTPUT
          fi

      - name: CDK diff (prod)
        run: |
          echo "Deploying prod with image tag: ${{ steps.image.outputs.TAG }}"
          cdk diff --all --context imageTag="${{ steps.image.outputs.TAG }}" --context stage=prod || echo "No changes detected."

      - name: CDK deploy (prod)
        run: cdk deploy --all --require-approval never --context imageTag="${{ steps.image.outputs.TAG }}" --context stage=prod
